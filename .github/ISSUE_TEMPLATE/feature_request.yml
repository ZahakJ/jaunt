name: Feature request
description: Something jaunt should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and where jaunt gets in the way. Check the manual's "Decisions" page first; some things are left out on purpose.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
