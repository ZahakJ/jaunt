# iroh-relay config for a jaunt mesh on a host with a public IP (VPS or Fly.io).
# Replace relay.example.net with your relay's DNS name (an A/AAAA record pointing at it)
# and the contact address with yours (Let's Encrypt uses it for expiry notices).
http_bind_addr = "[::]:80"
enable_relay = true
enable_metrics = false
# Lets machines behind NAT learn their public address, which is what makes direct paths
# possible. Needs [tls] and udp/7842 reachable from the internet.
enable_quic_addr_discovery = true

[tls]
https_bind_addr = "[::]:443"
quic_bind_addr = "[::]:7842"
hostname = "relay.example.net"
cert_mode = "LetsEncrypt"
contact = "you@example.net"
prod_tls = true
cert_dir = "/var/lib/iroh-relay/certs"

# Optional hardening, see README ("Access"). Default: anyone may use the relay to reach
# ids they already know; it still cannot read or alter traffic.
# [access]
# allowlist = ["<machine id>", "<machine id>"]
