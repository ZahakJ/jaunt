[package]
name = "jaunt"
version = "0.1.0"
edition = "2024"
description = "Hop between your own machines over direct, end-to-end encrypted peer-to-peer links"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "jaunt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
thiserror = "2"
clap = { version = "4.6.7", features = ["derive"] }
data-encoding = "2.11.1"
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring", "portmapper"] }
n0-error = "1"
n0-future = "0.3"
n0-watcher = "1"
rustls-pki-types = "1"
rustix = { version = "1.1", features = ["pty", "termios", "process", "fs", "system", "stdio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1.53.2", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = "fat"
strip = true
codegen-units = 1
opt-level = "s"
panic = "abort"
